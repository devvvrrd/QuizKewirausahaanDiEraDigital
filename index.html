<!doctype html><html><head><meta charset=utf-8><title>Quiz Kewirausahaan di Era Digital</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* QuizLearn: monokrom hitam-putih-abu dengan efek kaca (glass).
   Tata letak: satu kolom sempit seperti aplikasi HP, kartu kaca di atas latar abu bergradasi,
   navigasi melayang di bawah. Semua warna diatur lewat variabel di bawah ini. */
:root{
  --bg:#E8E8E8;
  --ink:#0A0A0A;
  --ink-2:#4F4F4F;
  --glass:rgba(255,255,255,.52);
  --glass-hi:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.82);
  --track:rgba(0,0,0,.10);
  --shadow:0 8px 24px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.9);
  --dark-1:#2C2C2C;
  --dark-2:#0A0A0A;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.on-dark :focus-visible{outline-color:#fff}

/* latar */
.bg{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(320px 320px at 100% 0%, #fff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(320px 320px at 0% 42%, rgba(90,90,90,.38) 0%, rgba(90,90,90,0) 70%),
    radial-gradient(340px 340px at 100% 86%, rgba(60,60,60,.34) 0%, rgba(60,60,60,0) 70%),
    linear-gradient(165deg,#F6F6F6 0%,#DCDCDC 48%,#F0F0F0 100%);
}

/* kerangka */
.app{
  max-width:520px;margin:0 auto;
  padding-block:20px 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--ink-2)}
main{display:flex;flex-direction:column;gap:14px;min-width:0;outline:none}

h1.h1{margin:6px 0 0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h2.h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
h3.h3{margin:0;font-size:15px;font-weight:700}
.lead{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* kaca */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(125%);
  backdrop-filter:blur(20px) saturate(125%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.card{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* tombol */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border-radius:23px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,var(--dark-1),var(--dark-2));
  color:#fff;font-weight:700;
  box-shadow:0 8px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.22);
  text-align:center;
}
.btn[disabled]{background:rgba(0,0,0,.12);color:#5A5A5A;box-shadow:none;border-color:transparent;cursor:not-allowed}
.btn-ghost{
  background:var(--glass-hi);color:var(--ink);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.9);
}
.btn-ghost[disabled]{background:rgba(255,255,255,.35);color:#5A5A5A}
.btn-light{background:rgba(255,255,255,.94);color:var(--ink);border-color:rgba(255,255,255,.9);box-shadow:none}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.back{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;
  padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);font-weight:600;font-size:13px;
}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3A3A3A,var(--ink))}

/* statistik */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.stat svg{display:block}
.stat b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.3;color:var(--ink-2)}

/* kartu gelap */
.dark{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,rgba(44,44,44,.94),rgba(10,10,10,.96));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.dark::before{
  content:"";position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);pointer-events:none;
}
.dark>*{position:relative}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#CFCFCF}
.dark .meta{color:#CFCFCF;font-size:13px}
.cta{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.cta .grow{flex:1 1 160px;display:flex;flex-direction:column;gap:3px}
.cta .t{font-size:17px;font-weight:700;line-height:1.25}

/* daftar bab */
.listbtn{
  width:100%;text-align:left;flex-direction:row;align-items:center;gap:12px;color:var(--ink);
}
.listbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.listbtn .tt{font-weight:700;font-size:15px;line-height:1.3}
.listbtn .ds{font-size:12px;color:var(--ink-2)}
.num{
  flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(210,210,210,.6));
  display:flex;align-items:center;justify-content:center;font-weight:800;
  box-shadow:0 6px 14px rgba(0,0,0,.08), inset 0 1px 0 #fff;
}

.note{font-size:12px;color:var(--ink-2);line-height:1.5}

/* soal */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Transisi saat berpindah soal: kartu soal keluar sebentar, lalu masuk dari arah tujuan.
   Hanya opacity dan transform yang dianimasikan agar tetap ringan di HP. */
@keyframes qIn{from{opacity:0;transform:translate3d(var(--qx,18px),0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.qsec.q-in-next{--qx:18px;animation:qIn .26s cubic-bezier(.22,.68,0,1) backwards;will-change:transform,opacity}
.qsec.q-in-prev{--qx:-18px;animation:qIn .26s cubic-bezier(.22,.68,0,1) backwards;will-change:transform,opacity}
.qsec.q-out-next,.qsec.q-out-prev{opacity:0;transition:opacity .11s ease-in,transform .11s ease-in;will-change:transform,opacity}
.qsec.q-out-next{transform:translate3d(-12px,0,0)}
.qsec.q-out-prev{transform:translate3d(12px,0,0)}
#main.q-swap .qsec *{transition:none!important}
@media(prefers-reduced-motion:reduce){.qsec.q-in-next,.qsec.q-in-prev{animation:none}.qsec.q-out-next,.qsec.q-out-prev{transition:none}.ov,.ov .sheet,.ov.is-closing,.ov.is-closing .sheet{animation:none!important}}
/* Transisi halus untuk perubahan status (pilihan jawaban, progres, nomor soal, tombol kalkulator, dock) */
html{scrollbar-gutter:stable}
.opt{transition:background-color .22s ease,color .22s ease,border-color .22s ease,opacity .22s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.opt .lt{transition:background-color .22s ease,color .22s ease,border-color .22s ease}
.bar>i{transition:width .38s cubic-bezier(.22,.68,0,1)}
.nb{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,filter .18s ease}
.ck{transition:transform .12s cubic-bezier(.2,.8,.2,1),background-color .12s ease,box-shadow .12s ease,filter .12s ease}
.cdisp .cd{transition:font-size .12s ease}
.dock button{transition:background-color .25s ease,color .25s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.ov{will-change:opacity}
.ov .sheet{will-change:transform,opacity}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:14px;
  background:var(--glass-hi);border:1px solid var(--edge);font-size:12px;font-weight:600;
}
.qtext{margin:0;font-size:17px;font-weight:700;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:18px;
  background:var(--glass-hi);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.9);
  line-height:1.4;
}
.opt .lt{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0;
}
.opt .tx{flex:1;min-width:0}
.opt .tag{display:block;margin-top:4px;font-size:12px;font-weight:700}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.sel .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.bad{background:rgba(255,255,255,.9);border:2px dashed var(--ink)}
.opt.bad .tx>span:first-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.og{display:flex;flex-direction:column;gap:8px}
.ex{margin:0 4px;border-radius:14px;padding:10px 14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.5}
.ex.ok{border:1.5px solid var(--ink)}
.ex.bad{border:1.5px dashed var(--ink)}
.ex b{display:flex;align-items:center;gap:6px;font-size:13px}
.ex p{margin:0}
.fb{border-radius:18px;padding:14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.fb b{font-size:15px;display:flex;align-items:center;gap:8px}
.fb p{margin:0;line-height:1.55}

/* ujian */
.timer{
  margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
}
.timer[data-low="1"]{background:#fff;color:var(--ink);text-decoration:underline}
.chip-btn{position:relative;cursor:pointer;color:var(--ink)}
.chip-btn::after{content:"";position:absolute;inset:-8px -4px}
.ctl{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px}
.ctl .btn{padding:0;min-width:0}
.btn-step{line-height:1}
.btn-step svg{display:block;flex:none}
.btn-ragu[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.nb{position:relative}
.nb.ragu{background:#8C8C8C;border-color:#8C8C8C;color:#0A0A0A}
.nb.ragu .l{color:#0A0A0A}
.nb .n{font-size:15px}
#overlay:empty{display:none}
.ov{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background:rgba(10,10,10,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:popupBackdropIn .2s ease-out both;
}
@keyframes popupBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes popupSheetIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.975)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes popupSheetOut{from{opacity:1;transform:translate3d(0,0,0) scale(1)}to{opacity:0;transform:translate3d(0,10px,0) scale(.985)}}
@keyframes popupBackdropOut{from{opacity:1}to{opacity:0}}
.ov .sheet{animation:popupSheetIn .24s cubic-bezier(.2,.75,.25,1) both;transform-origin:center bottom}
.ov.is-closing{pointer-events:none;animation:popupBackdropOut .17s ease-in both}
.ov.is-closing .sheet{animation:popupSheetOut .17s ease-in both}
.sheet{
  width:100%;max-width:440px;max-height:calc(100% - 8px);overflow:auto;border-radius:24px;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  background:rgba(255,255,255,.9);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.28);
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{
  width:40px;height:40px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.25);background:#fff;font-style:normal;font-weight:800;font-size:11px;color:var(--ink)}
.lg-done{background:var(--ink);border-color:var(--ink);color:#fff}
.lg-now{border:2.5px solid var(--ink)}
.lg-ragu{background:#8C8C8C;border-color:#8C8C8C;color:#0A0A0A}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.nb{
  min-height:54px;border-radius:14px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:0;
  font-variant-numeric:tabular-nums;
}
.nb .n{font-size:15px;font-weight:800}
.nb .l{font-size:12px;font-weight:700;color:var(--ink-2)}
.nb.done{background:var(--ink);border-color:var(--ink);color:#fff}
.nb.done .l{color:#fff}
.chip-ico{padding:0;width:36px;justify-content:center}
.chip-ico svg{display:block}
.cdisp{border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.7);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:2px;min-height:84px;overflow:hidden}
.cdisp .ce{font-size:13px;color:var(--ink-2);min-height:20px;max-width:100%;white-space:nowrap;overflow:hidden}
.cdisp .cd{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;max-width:100%;white-space:nowrap;overflow:hidden}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ck{height:52px;border-radius:16px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:0 4px 12px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.9)}
.ck svg{display:block}
.ck.fn{background:rgba(0,0,0,.08)}
.ck.op{background:linear-gradient(180deg,var(--dark-1),var(--dark-2));color:#fff;border-color:rgba(255,255,255,.18)}
.ck:active{transform:scale(.96)}
.nb.bad{background:rgba(255,255,255,.9);border:2px dashed var(--ink)}
.sheet-h h2.h2{font-size:19px}
.nb.now{border:3px solid var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.nb.done.now{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink)}
.confirm{border-radius:18px;padding:14px;background:rgba(255,255,255,.9);border:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;line-height:1.5}
ol.rules,ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.5}

/* hasil */
.score{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;font-weight:700;color:var(--ink-2);letter-spacing:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .glass{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.two b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.two span{font-size:12px;color:var(--ink-2)}

/* riwayat */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge);
}
.hist .hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hist .hn b{font-size:13px}
.hist .hn span{font-size:12px;color:var(--ink-2)}
.hist .nv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
/* penguasaan */
.mast,.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mt{font-weight:700;font-size:14px;line-height:1.35;min-width:0}
.mbot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{
  flex:none;display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;
  font-size:11px;font-weight:700;white-space:nowrap;border:1.5px solid var(--ink);background:#fff;color:var(--ink);
}
.pill-kuasai{background:var(--ink);color:#fff}
.pill-belum{border-style:dashed}
.pill-data{border-color:rgba(0,0,0,.3);color:var(--ink-2);font-weight:600}
.qlist li{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.qt{font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea{
  width:100%;min-height:96px;resize:vertical;padding:12px;border-radius:16px;border:1px solid var(--edge);
  background:rgba(255,255,255,.85);line-height:1.4;
}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.empty{margin:0;padding:18px 8px;text-align:center;color:var(--ink-2);line-height:1.5}

/* grafik */
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:rgba(0,0,0,.10);stroke-width:1}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink-2)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.chart .pe{fill:var(--ink);stroke:#fff;stroke-width:2}
.chart .tip{fill:var(--ink)}
.chart text.tipt{fill:#fff;font-weight:700;font-size:11px}

/* navigasi bawah */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events:none;
}
.dock-bar{
  pointer-events:auto;max-width:520px;margin:0 auto;height:68px;padding:0 8px;border-radius:32px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(24px) saturate(130%);backdrop-filter:blur(24px) saturate(130%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 32px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.95);
}
.dock button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;margin:0 2px;padding:0;
  border:0;border-radius:24px;background:transparent;color:var(--ink-2);font-size:11px;font-weight:600;
}
.dock button[aria-current="page"]{background:var(--ink);color:#fff;font-weight:700}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,12px);z-index:30;
  max-width:min(440px, calc(100vw - 32px));padding:12px 18px;border-radius:18px;background:var(--ink);color:#fff;
  font-weight:600;font-size:13px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.wel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px))}
.wel.fade{opacity:0;transition:opacity .25s ease}
.wel-blur{position:absolute;inset:0;background:rgba(240,240,240,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.wel-body{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
  animation:welIn .7s cubic-bezier(.22,1,.36,1) backwards;transition:opacity .35s ease, transform .35s ease}
.wel-body.out{opacity:0;transform:scale(.96);pointer-events:none}
.wel-t{margin:0;font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wel-btn{min-height:56px;padding:0 36px;font-size:17px;border-radius:28px}
@keyframes welIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ldIn{from{opacity:0}to{opacity:1}}
.ld .wel-blur{animation:ldIn .25s ease both}
.ld-pct{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ld-bar{width:min(240px,64vw);height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.ld-bar i{display:block;height:100%;width:100%;border-radius:4px;background:var(--ink);transform:scaleX(0);transform-origin:left;will-change:transform}
.ld-lbl{font-size:14px;font-weight:600;color:var(--ink-2)}
@media (max-width:360px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score{font-size:52px}
}

/* Efek interaksi universal untuk seluruh tombol, termasuk navigasi dan tombol dinamis */
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn){
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease,background-color .18s ease;
  transform-origin:center;
}
@media (hover:hover) and (pointer:fine){
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):hover{
  filter:brightness(1.08);
  box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 16px rgba(255,255,255,.16);
}
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):active,

  transform:scale(.955);
  filter:brightness(1.16);
  box-shadow:0 0 0 2px rgba(255,255,255,.62),0 0 10px rgba(255,255,255,.42),0 0 24px rgba(255,255,255,.24);

:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):focus-visible{
  outline:2px solid currentColor;
  outline-offset:3px;
}
@media (prefers-reduced-motion:reduce){
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn){transition:none}
}

  /* ----- kalkulator ----- */
  var OPSYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  function calcBaru() { return { cur: '0', acc: null, op: null, fresh: false, expr: '', err: false }; }
  calc = calcBaru();
  function cFmt(x) {
    x = String(x);
    if (/e/i.test(x)) return x.replace('.', ',');
    var neg = x.charAt(0) === '-'; if (neg) x = x.slice(1);
    var p = x.split('.'), ip = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + ip + (p.length > 1 ? ',' + p[1] : '');
  }
  function cHitung(a, o, b) {
    var r = o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
    if (!isFinite(r)) return null;
    return String(parseFloat(r.toPrecision(12)));
  }
  function cError() { calc = calcBaru(); calc.err = true; }
  function cTekan(k) {
    if (calc.err && k !== 'C') calc = calcBaru();
    var c = calc, r;
    if (k.length === 1 && k >= '0' && k <= '9') {
      if (c.fresh) { c.cur = k; c.fresh = false; }
      else if (c.cur.replace(/[-.]/g, '').length < 15) c.cur = c.cur === '0' ? k : (c.cur === '-0' ? '-' + k : c.cur + k);

  /* Animasi buka buram (dipakai layar sambutan dan layar loading): lingkaran jernih melebar dari titik (cx, cy) */
  function bukaBlur(el, blur, body, cx, cy, selesai) {
    var W = window.innerWidth, H = window.innerHeight;

    var dur = 1100, t0 = null;
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  /* ---------- layar loading 0-100% sebelum latihan / ujian dimulai ---------- */

    memuat = true;
    var el = document.createElement('div');
    el.className = 'wel ld'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', label);
    el.innerHTML = '<div class="wel-blur"></div><div class="wel-body"><div class="logo" aria-hidden="true">' + ic('bolt', 22) + '</div>' +
      '<div class="ld-pct">0%</div><div class="ld-bar" aria-hidden="true"><i></i></div><div class="ld-lbl">' + esc(label) + '</div></div>';
    document.body.appendChild(el);
    var inertEls = [document.querySelector('.app'), document.getElementById('dock')];
    inertEls.forEach(function (x) { if (x) x.setAttribute('inert', ''); });
    document.body.style.overflow = 'hidden';
    var pct = el.querySelector('.ld-pct'), bar = el.querySelector('.ld-bar i'), blur = el.querySelector('.wel-blur'), body = el.querySelector('.wel-body');
    function selesai() {

      document.body.style.overflow = (navOpen || calcOpen) ? 'hidden' : '';

    var dur = 1000, t0 = null;

  /* ---------- efek tekan tombol (delegasi: berlaku juga untuk tombol yang dibuat dinamis) ---------- */
  (function () {

    }
    document.addEventListener('pointerdown', function (e) {
      var el = e.target && e.target.closest ? e.target.closest(selector) : null;
      if (!el) return;
      release();
      pressed = el;
      el.classList.add('ql-pressed');
    }, true);
    function scheduleRelease() {

    }
    document.addEventListener('pointerup', scheduleRelease, true);

  if (aktif && aktif.endAt <= Date.now()) {
    finish(true);
    toast('Waktu ujian sebelumnya sudah habis. Hasil tersimpan di Progres.');
  } else {
    render();
  }
  if (!aktif) welcome();   // ujian yang sedang berjalan tidak ditunda oleh layar sambutan
})();

</script>
